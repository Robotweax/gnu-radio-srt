id: robotweax_srt_m0_probe_sink
label: Robotweax SRT M0 Probe Sink
category: '[Robotweax SRT]'

templates:
  imports: from gnuradio import robotweax_srt
  make: robotweax_srt.m0_probe_sink(${listener}, ${host}, ${port})

documentation: |-
  M0 scaffolding. Discards complex samples while a worker drives a nonblocking
  SRT Caller or Listener. Carries no samples; replaced by the SRT Sink in M2.

parameters:
- id: listener
  label: Listener
  dtype: bool
  default: 'False'
- id: host
  label: Host (numeric IPv4)
  dtype: string
  default: 127.0.0.1
- id: port
  label: Port
  dtype: int
  default: '9000'

asserts:
- ${ 1 <= port <= 65535 }

inputs:
- label: in
  domain: stream
  dtype: complex

file_format: 1
